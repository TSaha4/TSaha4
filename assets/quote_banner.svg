<svg viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@1,400;1,700&amp;display=swap');
      .quote-text {
        font-family: 'Space Mono', 'Fira Code', monospace;
        font-style: italic;
        font-size: 21px;
        fill: #E2E8F0;
      }
    </style>
    <linearGradient id="bgflat2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="110" fill="url(#bgflat2)"/>
  <rect x="0" y="0" width="900" height="110" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.35"/>

  <text x="450" y="50" text-anchor="middle" class="quote-text" opacity="0">
    "Keep building &#8212; even sinking ships teach you to swim."
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.25;0.75" dur="2.5s" fill="freeze"/>
  </text>

  <rect x="380" y="68" width="0" height="2" fill="#22D3EE">
    <animate attributeName="width" values="0;140" keyTimes="0;1" dur="1.4s" begin="1s" fill="freeze"/>
    <animate attributeName="x" values="450;380" keyTimes="0;1" dur="1.4s" begin="1s" fill="freeze"/>
  </rect>
</svg>
